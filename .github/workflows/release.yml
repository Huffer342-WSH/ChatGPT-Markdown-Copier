name: Release on Tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check types and tests
        run: |
          pnpm run compile
          pnpm run test

      - name: Package extension
        run: pnpm zip

      - name: Preserve package for store submission
        uses: actions/upload-artifact@v4
        with:
          name: edge-store-package
          path: .output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error

      - name: Decide release type by tag name
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nocasematch

          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ "${TAG_NAME}" =~ -((alpha|beta|rc|pre|preview)([.-][0-9A-Za-z]+)*)$ ]]; then
            echo "release_type=prerelease" >> "${GITHUB_OUTPUT}"
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "release_type=stable" >> "${GITHUB_OUTPUT}"
          echo "prerelease=false" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          EXTRA_ARGS=()
          if [[ "${{ steps.classify.outputs.prerelease }}" == "true" ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          npx --yes changelogithub \
            --capitalize \
            --group \
            --contributors \
            --name "${GITHUB_REF_NAME}" \
            --output RELEASE_NOTES.md \
            "${EXTRA_ARGS[@]}"

      - name: Include curated changelog
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(r'^## ' + re.escape(version) + r'[^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if section:
              notes = pathlib.Path('RELEASE_NOTES.md')
              notes.write_text(section.group(1).strip() + '\n\n---\n\n' + notes.read_text(encoding='utf-8'), encoding='utf-8')
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.classify.outputs.prerelease }}
          body_path: RELEASE_NOTES.md
          files: .output/*.zip

  edge-store:
    name: Submit to Edge Add-ons
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: edge-store-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: edge-store-package
          path: .output/store
      - name: Upload and submit package
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
          EDGE_RESUME_UPLOAD_ID: ${{ vars.EDGE_RESUME_UPLOAD_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-edge.mjs
